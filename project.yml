name: APRSERJi
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  APRSERJi-iOS:
    type: application
    platform: iOS
    info:
      path: build/iOS-Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: &locationUsage APRSERJi uses your location to show and follow your GPS track while the app is open.
        NSAppTransportSecurity: &tileTransport
          NSExceptionDomains:
            pdeffenb.homeip.net:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
    sources: [App]
    dependencies:
      - sdk: libsqlite3.tbd
      - framework: build/XCFrameworks/release/AprsCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aprserji.app
        INFOPLIST_KEY_CFBundleDisplayName: APRSERJi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  APRSERJi-macOS:
    type: application
    platform: macOS
    info:
      path: build/macOS-Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: *locationUsage
        NSLocationUsageDescription: *locationUsage
        NSAppTransportSecurity: *tileTransport
    sources: [App]
    dependencies:
      - sdk: libsqlite3.tbd
      - framework: build/XCFrameworks/release/AprsCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aprserji.app
        INFOPLIST_KEY_CFBundleDisplayName: APRSERJi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
schemes:
  APRSERJi-iOS:
    build:
      targets:
        APRSERJi-iOS: all
  APRSERJi-macOS:
    build:
      targets:
        APRSERJi-macOS: all
