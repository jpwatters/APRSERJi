name: APRSERJi
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.10"
    CURRENT_PROJECT_VERSION: "14"
    # Stable signing with KC9KKO's team keeps Keychain access approved between builds.
    DEVELOPMENT_TEAM: 7Q943H255L
    CODE_SIGN_STYLE: Automatic
targets:
  APRSERJi-iOS:
    type: application
    platform: iOS
    info:
      path: build/iOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocationWhenInUseUsageDescription: &locationUsage APRSERJi uses your location to show and follow your GPS track while the app is open.
        NSAppTransportSecurity: &tileTransport
          NSExceptionDomains:
            pdeffenb.homeip.net:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: &localNetwork APRSERJi connects to software modems such as Dire Wolf and UZ7HO, Tempest weather hubs and other APRS programs on your local network.
        NSBonjourServices: &bonjour
          - _kiss-tnc._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    sources: [App, WatchShared]
    dependencies:
      - sdk: libsqlite3.tbd
      - framework: build/XCFrameworks/release/AprsCore.xcframework
        embed: false
      # The Apple Watch companion app, installed on the paired Watch with the iPhone app.
      - target: APRSERJi-Watch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kc9kko.APRSERJi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: APRSERJi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  APRSERJi-macOS:
    type: application
    platform: macOS
    info:
      path: build/macOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The name in the menu bar and About box ("APRSERJi", not the target name "APRSERJi-macOS").
        CFBundleName: APRSERJi
        NSLocationWhenInUseUsageDescription: *locationUsage
        NSLocationUsageDescription: *locationUsage
        NSAppTransportSecurity: *tileTransport
        NSLocalNetworkUsageDescription: *localNetwork
        NSBonjourServices: *bonjour
        NSBluetoothAlwaysUsageDescription: APRSERJi connects to Bluetooth TNCs such as the Mobilinkd TNC4, BTECH UV-PRO and Kenwood TH-D74/D75.
    entitlements:
      path: build/macOS.entitlements
      properties:
        com.apple.security.personal-information.location: true
        # Gives the app its own data-protection keychain group, so the passcode needs no approval prompt.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kc9kko.APRSERJi
    sources: [App]
    dependencies:
      - sdk: libsqlite3.tbd
      - framework: build/XCFrameworks/release/AprsCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kc9kko.APRSERJi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: APRSERJi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  APRSERJi-Watch:
    type: application
    platform: watchOS
    info:
      path: build/Watch-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: APRSERJi
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kc9kko.APRSERJi
        WKRunsIndependentlyOfCompanionApp: false
    sources: [Watch, WatchShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kc9kko.APRSERJi.watchkitapp
        PRODUCT_NAME: APRSERJi-Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: APRSERJi
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  APRSERJi-iOS:
    build:
      targets:
        APRSERJi-iOS: all
  APRSERJi-macOS:
    build:
      targets:
        APRSERJi-macOS: all
  APRSERJi-Watch:
    build:
      targets:
        APRSERJi-Watch: all
